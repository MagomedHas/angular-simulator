<section class="users main-background-color alt">
  <div class="users__inner container">
    <h1>Список Пользователей</h1>
    <ul class="users__list">
      <li class="users__item two_lines">
        <app-user-create (createUser)="createUser($event)"></app-user-create>
      </li>
      @if (users$ | async; as users) {
        @for (user of users; track user.id) {
          <li class="users__item">
            <app-user-card (deleteUser)="deleteUser($event)" [user]="user"/>
          </li>
        } @empty {
          <li class="users__item-no no-users">
            <h2>Нет пользователей для отображения</h2>
          </li>
        }
      }
    </ul>

  </div>
</section>
