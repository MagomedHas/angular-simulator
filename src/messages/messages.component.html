<div class="messages">

  @if (messages$ | async; as messages) {
    @for (msg of messages; track msg.id) {
      <ng-container
        *ngTemplateOutlet="messageTemplate; context: { $implicit: msg }">
      </ng-container>
    }
  }
</div>

<ng-template #messageTemplate let-msg>
  <div class="message">
    <button
      (click)="displayMessagingService.closeMessage(msg.id)"
      [id]="`close_message_button_${msg.id}`"
      class="message__button">
      <fa-icon [icon]="faCircleXmark"  alt="Close message button"/>
    </button>
    <fa-icon [icon]="faEnvelope" alt="envelope" class="message__envelope"/>
    <h3 class="message__title">{{ msg.type }}</h3>
    <p class="message__content">{{ msg.message }}</p>
  </div>
</ng-template>
